; ============================================================
; 易知站点（yizhi.poticat.com）账号配置
; 用法：把本文件复制一份，重命名为 config.ini，然后填入自己的信息
;   Windows:  copy config.example.ini config.ini
;   Mac/Linux: cp config.example.ini config.ini
;
; 注意：config.ini 含明文密码，请勿提交到 Git 或发给他人。
; ============================================================

[yizhi]
; 登录邮箱
email = your_account@example.com

; 登录密码
password = your_password_here

; 备用 Token（可留空）
; 正常流程会从页面 localStorage / cookie 自动提取 Token；
; 只有当自动提取失败时才会用到这里的值。Token 会过期，留空更安全。
token =
